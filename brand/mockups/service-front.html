<html><head><meta charset="utf-8"><style>* { margin:0; padding:0; box-sizing:border-box; }
body { width:6.25in; height:4.25in; position:relative; overflow:hidden; font-family: Arial, Helvetica, sans-serif; }

.top img { height:1.15in; }

.band::before { content:''; position:absolute; left:0; right:0; top:0; height:6px; background:var(--gold); }
.big { font-size:27pt; font-weight:bold; line-height:1.1; margin-top:4pt; }
.sub { font-size:12.5pt; margin-top:8pt; opacity:.92; }

<div class="top"><img src="../../public/logo-print.png" alt=""></div>
