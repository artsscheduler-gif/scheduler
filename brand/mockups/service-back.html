<html><head><meta charset="utf-8"><style>* { margin:0; padding:0; box-sizing:border-box; }
body { width:6.25in; height:4.25in; position:relative; overflow:hidden; font-family: Arial, Helvetica, sans-serif; }
:root { --blue:#2b3990; --gold:#fbb016; --ink:#1d232a; }
body { background:#fff; color:var(--ink); }
.left { position:absolute; left:0.3in; top:0.3in; bottom:0.75in; width:2.65in; display:flex; flex-direction:column; justify-content:space-between; }
h1 { font-size:15pt; color:var(--blue); line-height:1.2; }
p { font-size:10pt; line-height:1.35; margin-top:5pt; }
.qrrow { display:flex; gap:8pt; align-items:center; }
.qr { width:0.95in; height:0.95in; background:repeating-conic-gradient(#1d232a 0 25%, #fff 0 50%) 0 0/12px 12px; }
.url { font-size:9pt; font-weight:bold; }
.foot { font-size:8pt; color:#555; border-top:3px solid var(--gold); padding-top:4pt; }
.addr { position:absolute; left:3.35in; right:0.3in; top:0.3in; bottom:0.75in; border:1px dashed #bbb; color:#999; font-size:8pt; display:flex; align-items:center; justify-content:center; text-align:center; }
</style></head><body>
<div class="left">
  <div><h1>Hi Pat &amp; Lee, it's been a while.</h1><p>Your last visit was in March 2026. Most cars need a check-up about every 6 months.</p></div>
  <div class="qrrow"><div class="qr"></div><div><div class="url">Scan to book online</div><p>or call <b>(610) 395-9338</b></p></div></div>
  <div class="foot">Art's Servicenter · 6661 Tilghman St, Allentown PA 18106</div>
</div>
<div class="addr">Address and postage area<br>(the printer fills this side)</div>
</body></html>
