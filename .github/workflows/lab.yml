name: Test lab
# Every night: six simulated weeks at the shop and the randomized rule checks,
# with a new random seed each time, so it keeps finding new situations. The
# result is saved to staging (Settings → Test runs in the admin), and a broken
# rule lands on the Checklist. "Run now" in the admin starts this too.
on:
  schedule:
    - cron: '0 8 * * *' # 3–4am in Allentown
  workflow_dispatch:
    inputs:
      seed:
        description: Replay a seed (blank = random)
        required: false
      request_id:
        description: Admin request this run answers (set by "Run now")
        required: false
      source:
        description: manual or replay (set by "Run now")
        required: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor
      - run: node scripts/write-local-env.mjs
      - name: Run the lab
        id: lab
        continue-on-error: true
        run: npm run lab -- --reporter=default --reporter=json --outputFile=tests/lab/out/vitest.json
        env:
          LAB_SEED: ${{ inputs.seed }}
          LAB_RUNS: 100
      - name: Save the result to staging
        if: always()
        run: npx tsx scripts/lab-report.ts
        env:
          REPORT_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          REPORT_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
          LAB_REQUEST_ID: ${{ inputs.request_id }}
          LAB_SOURCE: ${{ inputs.source }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-report
          path: tests/lab/out/
          retention-days: 30
      # Fail the job (GitHub emails the owner) when a rule broke.
      - if: steps.lab.outcome == 'failure'
        run: exit 1
