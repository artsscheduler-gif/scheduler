<html><head><meta charset="utf-8"><style>* { margin:0; padding:0; box-sizing:border-box; }
body { width:6.25in; height:4.25in; position:relative; overflow:hidden; font-family: Arial, Helvetica, sans-serif; }
:root { --blue:#2b3990; --gold:#fbb016; --ink:#1d232a; }
body { background: var(--blue); color:#fff; }
.panel { position:absolute; left:0.3in; right:0.3in; top:0.3in; height:1.45in; background:#fff; border-radius:10px; display:flex; align-items:center; justify-content:center; }
.panel img { height:1.15in; }
.msg { position:absolute; left:0.3in; right:0.3in; top:2.0in; text-align:center; }
.big { font-size:30pt; font-weight:bold; line-height:1.05; }
.rule { width:1.4in; height:5px; background:var(--gold); margin:10pt auto; border-radius:3px; }
.sub { font-size:12.5pt; opacity:.92; }
.foot { position:absolute; left:0.3in; right:0.3in; bottom:0.3in; text-align:center; font-size:10pt; letter-spacing:.5pt; opacity:.85; }
</style></head><body>
<div class="panel"><img src="../../public/logo-print.png" alt=""></div>
<div class="msg"><div class="big">Happy holidays</div><div class="rule"></div><div class="sub">From our family to yours. Thank you for a great year.</div></div>
<div class="foot">Family-run in Allentown since 1954</div>
</body></html>
